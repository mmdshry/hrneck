# Example Apache/LiteSpeed vhost fragments for HRNECK.
# Adjust paths and SSL to match the server (cPanel often manages SSL separately).

# --- Next.js front + tenant wildcard ---
# DocumentRoot /home/itneck/public_html/hrneck.com
# ServerName hrneck.com
# ServerAlias www.hrneck.com app.hrneck.com *.hrneck.com
# Include deploy/apache-next-proxy.htaccess logic via .htaccess in docroot
# OR:
# ProxyPass / http://127.0.0.1:3100/
# ProxyPassReverse / http://127.0.0.1:3100/
# ProxyPass / ws://127.0.0.1:3100/
# ProxyPassReverse / ws://127.0.0.1:3100/

# --- Laravel API ---
# DocumentRoot /home/itneck/apps/hrneck/apps/api/public
# ServerName api.hrneck.com
# AllowOverride All
# Require all granted

# --- Filament admin ---
# DocumentRoot /home/itneck/apps/hrneck/apps/api/public
# ServerName admin.hrneck.com
# AllowOverride All
# Require all granted

# cPanel userdata include for HRNECK Next + Reverb (SSL vhost).
# Install to:
#   /etc/apache2/conf.d/userdata/ssl/2_4/itneck/<host>/00-next-proxy.conf
# then: /scripts/ensure_vhost_includes && /scripts/rebuildhttpdconf && systemctl reload httpd
#
# Dual ProxyPass: ws:// first for Echo upgrades, http:// for Reverb HTTP fallback.
# A single http:// ProxyPass makes WSS handshakes return Reverb's plain-HTTP 500.

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"

ProxyPass "/.well-known/" "!"

ProxyPass "/app" "ws://127.0.0.1:8080/app"
ProxyPass "/app" "http://127.0.0.1:8080/app"
ProxyPassReverse "/app" "http://127.0.0.1:8080/app"

ProxyPass "/" "http://127.0.0.1:3100/"
ProxyPassReverse "/" "http://127.0.0.1:3100/"

name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: hrneck_central_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, openssl, pdo_mysql, tokenizer, xml, ctype, json, bcmath, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 30); do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306", "root", ""); exit(0);} catch (Throwable $e) { fwrite(STDERR, $e->getMessage().PHP_EOL); exit(1);}' && break
            sleep 2
          done
          # Align .env with phpunit.xml so pre-test migrate and Feature tests share one schema.
          php -r "file_put_contents('.env', preg_replace('/^DB_DATABASE=.*/m', 'DB_DATABASE=hrneck_central_testing', file_get_contents('.env')));"
          php artisan migrate --force --no-interaction
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build Filament Vite assets
        working-directory: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile --filter "./apps/api"
          pnpm --dir apps/api build
      - run: php artisan test
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G

  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: hrneck_central
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, openssl, pdo_mysql, tokenizer, xml, ctype, json, bcmath, redis
          coverage: none
      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist
      - name: Migrate and seed API
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate
          for i in $(seq 1 30); do
            php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306", "root", ""); exit(0);} catch (Throwable $e) { fwrite(STDERR, $e->getMessage().PHP_EOL); exit(1);}' && break
            sleep 2
          done
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
      - name: Start API
        working-directory: apps/api
        run: |
          # --no-reload is required for PHP_CLI_SERVER_WORKERS to take effect.
          PHP_CLI_SERVER_WORKERS=8 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/hrneck-api.log 2>&1 &
          echo $! > /tmp/hrneck-api.pid
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/up; then
              curl -sf http://127.0.0.1:8000/api/v1/health
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          cat /tmp/hrneck-api.log >&2
          exit 1
      - name: Route tenant and staff hosts to the web app
        run: |
          # Organization sign-in is on {slug}.hrneck.test and platform sign-in on app.hrneck.test. Resolve them locally.
          echo "127.0.0.1 hrneck.test app.hrneck.test itneck.hrneck.test test.hrneck.test company.hrneck.test" | sudo tee -a /etc/hosts
          docker run -d --name hrneck-e2e-proxy --network host \
            -v "$GITHUB_WORKSPACE/scripts/ci/Caddyfile.e2e:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine
          # Playwright starts Next on 3100 later; this only waits for Caddy to answer on port 80.
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://itneck.hrneck.test/; then
              exit 0
            fi
            sleep 1
          done
          echo "Caddy did not start" >&2
          docker logs hrneck-e2e-proxy >&2 || true
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      # Playwright serves the production build (next start), so build before the tests.
      - name: Build web app for E2E
        run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Playwright desktop
        run: >
          pnpm --dir apps/web exec playwright test --project=desktop-chromium
          --grep-invert "Learner portal|Password reset UI|Targets CSV import"
      - name: Playwright tenant hosts
        run: pnpm --dir apps/web exec playwright test --project=tenant-hosts
      - name: Restart API before mobile Playwright
        working-directory: apps/api
        run: |
          if [[ -f /tmp/hrneck-api.pid ]]; then
            kill "$(cat /tmp/hrneck-api.pid)" 2>/dev/null || true
            pkill -f "artisan serve --host=127.0.0.1 --port=8000" 2>/dev/null || true
            sleep 2
          fi
          # --no-reload is required for PHP_CLI_SERVER_WORKERS to take effect.
          PHP_CLI_SERVER_WORKERS=8 php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/hrneck-api.log 2>&1 &
          echo $! > /tmp/hrneck-api.pid
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/up; then
              curl -sf http://127.0.0.1:8000/api/v1/health
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready after restart" >&2
          cat /tmp/hrneck-api.log >&2
          exit 1
      - name: Playwright mobile
        run: pnpm --dir apps/web exec playwright test --project=mobile-chrome

  # Keep a single green check name for branch protection / Deploy needs.
  web:
    runs-on: ubuntu-latest
    needs: [web-unit, web-e2e]
    steps:
      - run: echo "web-unit and web-e2e passed"
